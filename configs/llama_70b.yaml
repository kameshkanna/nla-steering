# Config for Llama-3.3-70B-Instruct + released NLA checkpoints
# Requires 2x H100 80GB for base model + AV server

model: meta-llama/Llama-3.3-70B-Instruct
device: cuda

checkpoints:
  av: kitft/Llama-3.3-70B-NLA-L53-av
  ar: kitft/Llama-3.3-70B-NLA-L53-ar

sglang:
  av_url: http://localhost:30000
  ar_url: http://localhost:30001

nla:
  layer_idx: 53
  d_model: 8192

experiments:
  exp1:
    layer_stride: 8
    output: results/llama70b_exp1_flow.jsonl

  exp2:
    steering_concepts: [sycophancy, honesty, refusal, confidence]
    coefficients: [-3.0, -2.0, -1.0, 0.0, 1.0, 2.0, 3.0]
    caa_method: mean_diff
    output: results/llama70b_exp2_steering.jsonl

  exp3:
    narrative_coefficient: 1.0
    caa_coefficient: 2.0
    max_new_tokens: 200
    output: results/llama70b_exp3_narrative.jsonl
